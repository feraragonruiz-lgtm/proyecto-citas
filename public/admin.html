<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mabel Citas · Administración</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="encabezado">
    <img src="logo.svg" alt="Mabel Citas">
  </header>

  <section id="seccion-crear" hidden>
    <h2>Crea tu clave</h2>
    <p>Es la primera vez que entras. Elige la clave con la que vas a entrar al panel (mínimo 8 caracteres) y anótala en un lugar seguro.</p>
    <form id="form-crear-clave">
      <label>
        Nueva clave
        <input type="password" name="clave" autocomplete="new-password" minlength="8" required>
      </label>
      <label>
        Repite la clave
        <input type="password" name="repetir" autocomplete="new-password" minlength="8" required>
      </label>
      <button type="submit">Crear clave</button>
    </form>
    <p id="error-crear" class="resultado error" hidden></p>
  </section>

  <section id="seccion-login" hidden>
    <h2>Administración</h2>
    <form id="form-login">
      <label>
        Clave de administración
        <input type="password" name="clave" autocomplete="current-password" required>
      </label>
      <button type="submit">Entrar</button>
    </form>
    <p id="error-login" class="resultado error" hidden></p>
  </section>

  <section id="seccion-panel" hidden>
    <div class="barra">
      <h2>Solicitudes de citas</h2>
      <button type="button" id="boton-salir" class="secundario">Salir</button>
    </div>
    <button type="button" id="boton-actualizar" class="secundario">Actualizar lista</button>
    <p id="error-panel" class="resultado error" hidden></p>
    <div id="lista"></div>
  </section>

  <script src="admin.js"></script>
</body>
</html>
