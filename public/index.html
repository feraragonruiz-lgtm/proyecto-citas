<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mabel Citas</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="encabezado">
    <img src="logo.svg" alt="Mabel Citas">
  </header>

  <section>
    <h2>Pedir una cita</h2>
    <form id="form-crear">
      <label>
        Nombre
        <input type="text" name="nombre" required>
      </label>
      <label>
        Teléfono (WhatsApp)
        <input type="tel" name="contacto" autocomplete="tel" placeholder="8888 8888" required>
      </label>
      <label>
        Email (ahí te llega la confirmación)
        <input type="email" name="email" autocomplete="email" placeholder="tu@correo.com" required>
      </label>
      <label>
        Fecha y hora
        <input type="datetime-local" name="fecha_hora" required>
      </label>
      <button type="submit">Enviar solicitud</button>
    </form>
    <p id="resultado-crear" class="resultado" hidden></p>
  </section>

  <section>
    <h2>Consultar estado</h2>
    <form id="form-consultar">
      <label>
        Código de seguimiento
        <input type="text" name="codigo" placeholder="SOL-XXXXXXXX" required>
      </label>
      <button type="submit">Consultar</button>
    </form>
    <div id="resultado-consultar" class="resultado" hidden></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
